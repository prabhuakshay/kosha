name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kosha
          POSTGRES_PASSWORD: kosha
          POSTGRES_DB: kosha
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-padding-to-fifty-chars
      ALLOWED_HOSTS: kosha.example.com
      DATABASE_URL: postgres://kosha:kosha@localhost:5432/kosha
      # Opt-in HSTS settings, enabled so --fail-level WARNING catches anything else.
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
      SECURE_HSTS_PRELOAD: "true"
      # Placeholders: required at startup, never connected to here.
      S3_BUCKET_NAME: kosha-ci
      S3_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev manage.py check --deploy --fail-level WARNING
      - run: uv run --no-dev manage.py makemigrations --check --dry-run
      - run: uv run --no-dev manage.py migrate --noinput
      - run: uv run --no-dev manage.py collectstatic --noinput
      - run: uv sync --locked
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: kosha:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke-test.sh kosha:smoke
