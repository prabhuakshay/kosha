<header class="head head-row">
    <h2 class="title">Tags</h2>
    <a href="{% url 'masters:new_tag' %}" class="tb" title="New tag" aria-label="New tag"><i data-lucide="plus"></i></a>
    <p class="lede">The context money moved in. Typing a new one makes it.</p>
</header>
{% if tags %}
    <nav class="group" aria-label="Tags">
        {% for tag in tags %}
            <a href="{% url 'masters:tag' tag.pk %}" class="row" {% if tag == selected %}aria-current="page"{% endif %}>
                <span class="glyph"><i data-lucide="hash"></i></span>
                <span class="row-main"><span class="row-title" data-name>{{ tag.name }}</span></span>
                <i data-lucide="chevron-right" class="row-chev"></i>
            </a>
        {% endfor %}
    </nav>
{% else %}
    <p class="group-note">None yet</p>
{% endif %}
