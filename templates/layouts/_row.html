<li>
    <a href="{% url to %}" class="flex items-center gap-3 px-3.5 py-3">
        <span class="tile"><i data-lucide="{{ icon }}"></i></span>
        <span class="min-w-0 flex-1">
            <span class="block text-[15px] font-semibold">{{ title }}</span>
            <span class="block truncate text-[13px] text-ink-2">{{ sub }}</span>
        </span>
        <i data-lucide="chevron-right" class="text-ink-3"></i>
    </a>
</li>
