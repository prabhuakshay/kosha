{% comment %}A row leading to `to`, selected on it and on any page named in `also`.{% endcomment %}
{% with current=request.resolver_match.view_name %}
    <a href="{% url to %}" class="row" {% if current == to or current in also.split %}aria-current="page"{% endif %}>
        <span class="glyph"><i data-lucide="{{ icon }}"></i></span>
        <span class="row-main"><span class="row-title">{{ title }}</span>{% if sub %}<span class="row-sub">{{ sub }}</span>{% endif %}</span>
        {% if value %}<span class="row-value">{{ value }}</span>{% endif %}
        <i data-lucide="chevron-right" class="row-chev"></i>
    </a>
{% endwith %}
