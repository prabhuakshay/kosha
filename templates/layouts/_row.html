{% comment %}A row in a list pane, selected on `to` and on any page named in `also`.{% endcomment %}
{% with current=request.resolver_match.url_name %}
    <a href="{% url to %}" class="row" {% if current == to or current in also.split %}aria-current="page"{% endif %}>
        <span class="tile"><i data-lucide="{{ icon }}"></i></span>
        <span class="min-w-0 flex-1">
            <span class="block text-[15px] font-semibold">{{ title }}</span>
            <span class="row-sub">{{ sub }}</span>
        </span>
        <i data-lucide="chevron-right" class="row-chevron"></i>
    </a>
{% endwith %}
