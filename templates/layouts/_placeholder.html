{% comment %}
    The detail pane with nothing open in it: `icon`, `heading` and `text`,
    and a button to `add` the first one, labelled `add_label`, if given.
{% endcomment %}
<div class="grid min-h-[60dvh] place-items-center text-center">
    <div>
        <span class="tile mx-auto size-14 rounded-2xl"><i data-lucide="{{ icon }}" class="size-6"></i></span>
        <h1 class="display mt-5 text-[28px]">{{ heading }}</h1>
        <p class="note mx-auto max-w-[36ch]">{{ text }}</p>
        {% if add %}
            <div class="actions justify-center"><a href="{{ add }}" class="btn"><i data-lucide="plus"></i>{{ add_label }}</a></div>
        {% endif %}
    </div>
</div>
