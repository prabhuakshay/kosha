{% comment %}
    A link in the app rail; without `to`, a feature still to come. It is the
    current one on `to` itself.
{% endcomment %}
{% with current=request.resolver_match.view_name %}
    {% if to %}
        <a href="{% url to %}" class="rail-link" title="{{ label }}" {% if current == to %}aria-current="page"{% endif %}><i data-lucide="{{ icon }}"></i><span class="rail-label">{{ label }}</span></a>
    {% else %}
        <span class="rail-link" aria-disabled="true" title="{{ label }} · soon"><i data-lucide="{{ icon }}"></i><span class="rail-label">{{ label }}</span><span class="rail-soon">Soon</span></span>
    {% endif %}
{% endwith %}
