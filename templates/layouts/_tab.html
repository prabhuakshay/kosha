{% comment %}
    A tab in the phone's tab bar, the current one anywhere in the sections
    named in `of`; without `to`, a feature still to come.
{% endcomment %}
{% if to %}
    <a href="{% url to %}" class="tab" {% if section in of.split %}aria-current="page"{% endif %}><i data-lucide="{{ icon }}"></i>{{ label }}</a>
{% else %}
    <span class="tab" aria-disabled="true"><i data-lucide="{{ icon }}"></i>{{ label }}</span>
{% endif %}
