{% comment %}
    The section `name` in the app rail. The wide rail links to its index `to`
    and, while in the section, shows its `links` beneath; the icon-only rail
    opens them in a flyout.
{% endcomment %}
<a href="{% url to %}" class="rail-link rail-wide" title="{{ label }}" {% if request.resolver_match.view_name == to %}aria-current="page"{% elif section == name %}aria-current="true"{% endif %}><i data-lucide="{{ icon }}"></i><span class="rail-label">{{ label }}</span></a>
{% if section == name %}
    <div class="rail-sub">{% include links %}</div>
{% endif %}
<button type="button" popovertarget="{{ name }}-flyout" class="rail-link rail-narrow" title="{{ label }}" {% if section == name %}aria-current="true"{% endif %}><i data-lucide="{{ icon }}"></i></button>
<div id="{{ name }}-flyout" popover class="flyout">{% include links %}</div>
