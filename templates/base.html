{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
    <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
    <title>{% block title %}Kosha{% endblock %}</title>
    <link rel="manifest" href="{% url 'manifest' %}">
    <link rel="icon" href="{% static 'icons/icon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}" nonce="{{ csp_nonce }}">
    <script src="{% static 'js/htmx.min.js' %}" nonce="{{ csp_nonce }}" defer></script>
    <script src="{% static 'js/alpine.min.js' %}" nonce="{{ csp_nonce }}" defer></script>
    <script src="{% static 'js/lucide.min.js' %}" nonce="{{ csp_nonce }}" defer></script>
    <script src="{% static 'core/app.js' %}" nonce="{{ csp_nonce }}" data-service-worker="{% url 'service_worker' %}" defer></script>
  </head>
  <body class="min-h-dvh font-sans antialiased">
    {% block content %}{% endblock %}
  </body>
</html>
