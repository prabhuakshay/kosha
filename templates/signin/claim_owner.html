{% extends "layouts/signed_out.html" %}
{% block title %}Claim · Kosha{% endblock %}
{% block main %}
    <h1 class="display mt-10 text-[42px] leading-none lg:text-[48px]">Make it yours</h1>
    <p class="mt-4 text-[15px] leading-6 text-ink-2">You'll be this Kosha's Owner, and its only sign-in.</p>
    <form method="post" class="mt-8">
        {% csrf_token %}
        <div class="grid gap-4">
            <label class="block">
                <span class="label">Name</span>
                <input class="field mt-1.5" name="name" value="{{ form.name.value|default:'' }}" autocomplete="name" required autofocus>
                {% include "signin/_errors.html" with field=form.name %}
            </label>
            <label class="block">
                <span class="label">Email</span>
                <input class="field mt-1.5" type="email" name="email" value="{{ form.email.value|default:'' }}" autocomplete="email" required>
                {% include "signin/_errors.html" with field=form.email %}
            </label>
            <label class="block">
                <span class="label">Password</span>
                <input class="field mt-1.5" type="password" name="password" autocomplete="new-password" required>
                {% include "signin/_errors.html" with field=form.password %}
            </label>
        </div>
        <p class="mt-3 text-[13px] text-ink-3">You'll sign in with this email.</p>
        <button class="btn mt-8">Continue</button>
    </form>
{% endblock %}
