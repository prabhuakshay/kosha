<p class="mt-2 text-[14px] leading-5 text-ink-2">Sign in with your fingerprint or face, no password.</p>
{% if passkeys %}
    <ul class="mt-4 divide-y">
        {% for passkey in passkeys %}
            <li class="py-3 text-[15px] font-medium" data-passkey-name>{{ passkey.name }}</li>
        {% endfor %}
    </ul>
{% endif %}
