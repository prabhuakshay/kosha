{% extends "layouts/signed_out.html" %}
{% block title %}Sign in · Kosha{% endblock %}
{% block main %}
    <h1 class="display mt-10 text-[42px] leading-none lg:text-[48px]">Sign in</h1>
    <form method="post" class="mt-8">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="grid gap-4">
            {% if form.errors %}
                <p class="flex items-center gap-2 text-[14px] font-medium text-bad"><i data-lucide="triangle-alert" class="size-4"></i>That email and password don't match.</p>
            {% endif %}
            <label class="block">
                <span class="text-[13px] font-medium text-ink-2">Email</span>
                <input class="field mt-1.5" type="email" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
            </label>
            <label class="block">
                <span class="text-[13px] font-medium text-ink-2">Password</span>
                <input class="field mt-1.5" type="password" name="password" autocomplete="current-password" required>
            </label>
        </div>
        <button class="btn mt-8">Sign in</button>
    </form>
{% endblock %}
